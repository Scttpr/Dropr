# Production Compose file for Dropr (Docker Engine + Compose v2 on Debian or
# Ubuntu; podman-compose works too). deploy/docker/setup.sh lays out a
# directory such as /opt/dropr around this file:
#
#   /opt/dropr/compose.yaml     this file
#   /opt/dropr/.env             image reference and host settings (env.example)
#   /opt/dropr/dropr.toml       config, mounted read-only
#   /opt/dropr/secrets/         refresh_key, oidc_key.pem (owned by UID 65532, 0400)
#   /opt/dropr/data/            /data: SQLite, blobs, ACME cache (UID 65532, 0700)
#   /opt/dropr/backups/         /backups: output of `dropr backup`
#
# Dropr listens on 8443 inside the container and, with tls = "acme", obtains
# its own Let's Encrypt certificate (TLS-ALPN-01): only host port 443 is needed.
# Guide: docs/deploy-debian.md.
name: dropr

services:
  dropr:
    # Pin by digest: DROPR_IMAGE=ghcr.io/scttpr/dropr@sha256:<verified digest>
    # (see SECURITY.md), or a local tag built with deploy/Containerfile.
    image: ${DROPR_IMAGE:?set DROPR_IMAGE in .env}
    restart: unless-stopped
    stop_grace_period: 30s
    ports:
      # Docker publishes ports with its own iptables rules, BEFORE ufw or
      # firewalld rules: whatever is published here is reachable. Bind to one
      # address with DROPR_BIND if the host has several.
      - "${DROPR_BIND:-0.0.0.0}:443:8443"
      # HTTP -> HTTPS redirect (redirect_http = true in dropr.toml, listening on
      # :8080 inside the container). Remove if you do not want port 80 open.
      - "${DROPR_BIND:-0.0.0.0}:80:8080"
    networks: [dropr]

    # Sandbox: non-root UID 65532 (set by the image), no shell in the image,
    # read-only root file system, no capabilities, no privilege escalation,
    # Docker's default seccomp and AppArmor profiles.
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777,noexec,nosuid,nodev
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    pids_limit: 512
    mem_limit: ${DROPR_MEM_LIMIT:-4g}
    ulimits:
      nofile: { soft: 65536, hard: 65536 }

    volumes:
      - ./data:/data
      - ./backups:/backups
      - ./dropr.toml:/etc/dropr/dropr.toml:ro
    # File secrets are bind mounts that keep the host owner and mode, so
    # setup.sh makes them 0400 and owned by 65532 inside a root-only directory.
    secrets:
      - refresh_key
      - oidc_key

    # The image has no shell or curl: the binary probes its own GET /healthz.
    healthcheck:
      test: ["CMD", "/bin/dropr", "healthcheck", "--config", "/etc/dropr/dropr.toml"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3

    # journald keeps Dropr's logs out of unbounded json files and lets
    # journald enforce retention (7 days, see docs/deploy-debian.md).
    # Read them with `docker compose logs` or `journalctl CONTAINER_TAG=dropr`.
    logging:
      driver: journald
      options:
        tag: dropr

networks:
  dropr: {}

secrets:
  refresh_key:
    file: ./secrets/refresh_key
  oidc_key:
    file: ./secrets/oidc_key.pem
