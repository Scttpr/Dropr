# Journal namespace of dropr.service (LogNamespace=dropr): Dropr's request
# logs are kept 7 days, independently of the system journal.
# Read them with `journalctl --namespace=dropr`.
# Installed as /etc/systemd/journald@dropr.conf by install.sh.
[Journal]
Storage=persistent
MaxRetentionSec=7d
SystemMaxUse=1G
Compress=yes
