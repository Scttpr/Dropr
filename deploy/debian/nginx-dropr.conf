# nginx in front of Dropr (tls = "proxy", listen = "127.0.0.1:8080",
# trusted_proxies = ["127.0.0.1"]). Only needed when Dropr must share ports
# 80/443 with other sites; otherwise let Dropr terminate TLS itself.
#
#   cp nginx-dropr.conf /etc/nginx/sites-available/dropr
#   ln -s ../sites-available/dropr /etc/nginx/sites-enabled/dropr
#   # obtain a certificate first, e.g. certbot certonly --webroot -w /var/www/html -d drop.example.com
#   nginx -t && systemctl reload nginx
#
# Requirements (docs/operations.md "TLS modes"): 32 MiB part bodies, no
# buffering in either direction, long timeouts, own origin at the root path,
# and Dropr's security headers passed through untouched.

server {
    listen 80;
    listen [::]:80;
    server_name drop.example.com;
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    # Debian 12 / Ubuntu 24.04 nginx syntax; on nginx >= 1.25.1 prefer `http2 on;`.
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name drop.example.com;

    ssl_certificate     /etc/letsencrypt/live/drop.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/drop.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305;
    ssl_prefer_server_ciphers off;
    ssl_session_tickets off;
    server_tokens off;

    client_max_body_size 64m;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        # Overwrite, never append: Dropr trusts only what 127.0.0.1 sends.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;

        proxy_request_buffering off;
        proxy_buffering off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
}
