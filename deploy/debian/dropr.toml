# Dropr configuration for the systemd install (deploy/debian/install.sh puts it
# in /etc/dropr/dropr.toml, root:dropr 0640, and never overwrites it).
# Reference: docs/operations.md "Configuration reference".
#
# Edit every <...> placeholder and drop.example.com, then:
#   sudo systemctl enable --now dropr
#   journalctl --namespace=dropr -f
#
# Keep the two secret paths as they are: systemd loads the files from
# /etc/dropr/credentials/ (root-only) and exposes them to the service there.

public_url    = "https://drop.example.com"   # chosen once: request link keys are bound to it
mode          = "production"
data_dir      = "/var/lib/dropr"

# Built-in Let's Encrypt (TLS-ALPN-01): only TCP 443 must reach this host.
tls           = "acme"
listen        = ":443"
acme_email    = "admin@example.com"
redirect_http = true                          # port 80 only redirects to HTTPS
redirect_listen = ":80"

# Behind nginx or Caddy on the same host instead (deploy/debian/nginx-dropr.conf),
# replace the block above with:
#   tls             = "proxy"
#   listen          = "127.0.0.1:8080"
#   trusted_proxies = ["127.0.0.1"]
# and remove CAP_NET_BIND_SERVICE from the unit (see dropr.service).

refresh_key_file = "/run/credentials/dropr.service/refresh_key"
login_label      = "Sign in with Microsoft"

[limits]
max_file_size  = "5GB"             # at most 100GB (binary units)
user_quota     = "50GB"
default_expiry = "7d"              # 1h, 1d, 7d or 30d
# disk_headroom = "10GB"          # default max(1GB, 5% of the disk)
# max_transfers = 512
# max_transfers_per_ip = 32
# min_transfer_rate = "4KB"

# Microsoft Entra ID (docs/setup-entra.md). For Keycloak see docs/setup-keycloak.md.
[oidc]
issuer          = "https://login.microsoftonline.com/<tenant-id>/v2.0"
client_id       = "<application-id>"
client_auth     = "private_key_jwt"
client_key_file = "/run/credentials/dropr.service/oidc_key"
scopes          = ["openid", "profile", "offline_access"]
role_claim      = "roles"
required_role   = "Dropr.User"
display_claim   = "name"
required_claims = { tid = "<tenant-id>" }
revalidate_every = "15m"
allow_unadvertised_pkce = true     # Entra supports S256 without advertising it
