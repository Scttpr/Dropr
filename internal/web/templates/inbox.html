{{define "title"}}Received files · Dropr{{end}}
{{define "main"}}{{with .View}}
<main id="main" class="site-main" data-page="inbox"{{if ge .Count 0}} data-count="{{.Count}}"{{end}}>
  <div class="page-head">
    <h1>Received files</h1>
  </div>
  <p id="inbox-warning" class="warning">These files were sent by people outside your
     organisation through your request links. Only open files you expect.</p>
  <section class="card" aria-label="Files">
    <button type="button" id="inbox-unlock" class="button button-primary button-large" data-js-only hidden>Unlock your inbox</button>
    <p id="inbox-status" class="transfer-status" role="status" aria-live="polite"></p>
    <div id="inbox-error" class="error" role="alert" tabindex="-1" hidden></div>

    <div class="table-wrap">
      <table id="inbox-table" class="data-table" hidden>
        <caption class="visually-hidden">Received files</caption>
        <thead><tr>
          <th scope="col">Name</th><th scope="col">Size</th><th scope="col">Received</th>
          <th scope="col"><span class="visually-hidden">Actions</span></th>
        </tr></thead>
        <tbody id="inbox-list"></tbody>
      </table>
    </div>
    <p id="inbox-empty" class="empty" hidden tabindex="-1">No files received yet.</p>

    <div id="download-panel" class="transfer" hidden>
      <p id="download-file-name" class="transfer-name"></p>
      <progress id="download-progress" max="100" value="0" aria-labelledby="download-file-name"></progress>
      <p id="download-status" class="transfer-status" role="status" aria-live="polite"></p>
      <div class="button-row"><button type="button" id="download-cancel" class="button">Cancel</button></div>
    </div>
    <noscript><p class="notice">Received files are decrypted in your browser with your passkey, which needs JavaScript. Please enable it for this site.</p></noscript>
  </section>
</main>
{{end}}{{end}}
