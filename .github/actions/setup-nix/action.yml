name: Set up Nix
description: >
  Install upstream Nix and restore this job's /nix/store from the Actions
  cache. Only pushes to main save the cache: pull requests restore it but
  never write it, which keeps the 10 GB repository quota for main.

inputs:
  cache-key:
    description: Name of this job's store cache (each job has its own closure).
    required: true
  cache:
    description: "'false' skips the store cache entirely (release builds)."
    default: "true"
  store-size:
    description: >
      Store size kept when saving; dead paths beyond it are garbage-collected
      first. Must hold the job's whole closure, or later runs re-download.
    default: 3G

runs:
  using: composite
  steps:
    - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
      with:
        determinate: false        # upstream Nix, no FlakeHub login
        diagnostic-endpoint: ""   # no installer telemetry
        summarize: false
        # The store cache is garbage-collected before saving, which deletes
        # .drv files that Nix's evaluation cache still points to; a restored
        # eval cache then fails with "store path ... does not exist".
        # Re-evaluating the flake costs seconds.
        extra-conf: |
          eval-cache = false

    - if: inputs.cache == 'true'
      uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7
      with:
        # Bump v<n> to discard every saved store (v1 held a stale eval cache).
        primary-key: nix-v2-${{ inputs.cache-key }}-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('flake.nix', 'flake.lock', 'nix/hashes.nix') }}
        restore-prefixes-first-match: nix-v2-${{ inputs.cache-key }}-${{ runner.os }}-${{ runner.arch }}-
        gc-max-store-size-linux: ${{ inputs.store-size }}
        save: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
