name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

# Actions are pinned by commit SHA (version in the trailing comment).
# Refresh with: gh api repos/<owner>/<repo>/commits/<tag> --jq .sha

jobs:
  flake-check:
    name: nix flake check
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
      - uses: DeterminateSystems/magic-nix-cache-action@84c0677f58dcedf3b91f8223ce36a9ea5b3c84b7 # v15
      - run: nix flake check -L
      - name: Reproducibility (web assets build twice, identical)
        run: |
          nix build .#web-assets
          nix build --rebuild .#web-assets

  checks:
    name: make check, fuzz smoke, web tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
      - uses: DeterminateSystems/magic-nix-cache-action@84c0677f58dcedf3b91f8223ce36a9ea5b3c84b7 # v15
      - name: Web dependencies
        run: nix develop -c bash -c 'cd web && npm ci'
      - name: Web typecheck, tests, build
        run: nix develop -c bash -c 'cd web && npm run typecheck && npm test && npm run build'
      - name: Build, lint, race tests, govulncheck
        run: nix develop -c make check
      - name: Fuzz smoke
        run: nix develop -c make fuzz FUZZTIME=10s

  audit:
    name: govulncheck and npm audit
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
      - uses: DeterminateSystems/magic-nix-cache-action@84c0677f58dcedf3b91f8223ce36a9ea5b3c84b7 # v15
      - run: nix develop -c govulncheck ./...
      - run: nix develop -c bash -c 'cd web && npm audit --audit-level=high'

  keycloak-integration:
    name: Go integration tests against Keycloak
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
      - uses: DeterminateSystems/magic-nix-cache-action@84c0677f58dcedf3b91f8223ce36a9ea5b3c84b7 # v15
      - name: Start Keycloak (image pinned in dev/compose.yaml)
        run: |
          image=$(grep -oE 'quay.io/keycloak/keycloak:[^ ]+' dev/compose.yaml | head -1)
          docker run -d --name keycloak -p 127.0.0.1:8180:8180 \
            -e KC_BOOTSTRAP_ADMIN_USERNAME=admin -e KC_BOOTSTRAP_ADMIN_PASSWORD=admin \
            -v "$PWD/dev/keycloak/dropr-realm.json:/opt/keycloak/data/import/dropr-realm.json:ro" \
            "$image" start-dev --import-realm --http-port=8180
          for i in $(seq 1 90); do
            curl -fsS http://localhost:8180/realms/dropr/.well-known/openid-configuration >/dev/null && exit 0
            sleep 2
          done
          docker logs keycloak; exit 1
      - run: nix develop -c make test-keycloak

  e2e:
    name: Playwright E2E
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
      - uses: DeterminateSystems/magic-nix-cache-action@84c0677f58dcedf3b91f8223ce36a9ea5b3c84b7 # v15
      - name: Start Keycloak
        run: |
          image=$(grep -oE 'quay.io/keycloak/keycloak:[^ ]+' dev/compose.yaml | head -1)
          docker run -d --name keycloak -p 127.0.0.1:8180:8180 \
            -e KC_BOOTSTRAP_ADMIN_USERNAME=admin -e KC_BOOTSTRAP_ADMIN_PASSWORD=admin \
            -v "$PWD/dev/keycloak/dropr-realm.json:/opt/keycloak/data/import/dropr-realm.json:ro" \
            "$image" start-dev --import-realm --http-port=8180
          for i in $(seq 1 90); do
            curl -fsS http://localhost:8180/realms/dropr/.well-known/openid-configuration >/dev/null && exit 0
            sleep 2
          done
          docker logs keycloak; exit 1
      # Ubuntu 24.04 denies unprivileged user namespaces through AppArmor;
      # WebKit's web processes sandbox with bubblewrap and die without them
      # ("Target page, context or browser has been closed" on newPage).
      - name: Allow unprivileged user namespaces (WebKit sandbox)
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      # Browsers come from nixpkgs (PLAYWRIGHT_BROWSERS_PATH in the dev shell);
      # the npm @playwright/test version must equal $PLAYWRIGHT_VERSION.
      # Pull requests run Chromium only; main and tags run every browser.
      - env:
          PROJECTS: ${{ github.event_name == 'pull_request' && '--project=chromium' || '' }}
          # Temporary: print browser stderr to find why WebKit pages die on newPage.
          DEBUG: pw:browser
        run: nix develop -c bash -c "cd e2e && npm ci && npx playwright test $PROJECTS"
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: e2e/playwright-report
          if-no-files-found: ignore

  release:
    name: release (binaries, asset hashes, signature)
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [flake-check, checks, audit, keycloak-integration]
    runs-on: ubuntu-24.04
    permissions:
      contents: write     # create the GitHub release
      id-token: write     # keyless cosign signing
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false, fetch-depth: 0 }
      - name: Verify the tag signature
        run: |
          # Needs the maintainers' signing keys in the runner keyring; adapt to
          # your key distribution (for SSH-signed tags: gpg.ssh.allowedSignersFile).
          git tag -v "$GITHUB_REF_NAME" || echo "::warning::tag signature not verified in CI"
      - uses: DeterminateSystems/nix-installer-action@3138316df39ed29be04236d7ffc686fa525866aa # v23
      - uses: DeterminateSystems/magic-nix-cache-action@84c0677f58dcedf3b91f8223ce36a9ea5b3c84b7 # v15
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      - name: Build and hash the web assets
        run: |
          nix build -o web-assets .#web-assets
          { (cd web-assets && sha256sum *); (cd internal/web/static && sha256sum app.css favicon.svg); } \
            | sort -k2 > "dropr-assets-${GITHUB_REF_NAME}.sha256"
          cat "dropr-assets-${GITHUB_REF_NAME}.sha256"

      # Static binaries. They embed exactly the web assets hashed above.
      - name: Build the release binaries
        run: |
          cp -r web-assets/. internal/web/static/
          for arch in amd64 arm64; do
            nix develop -c env CGO_ENABLED=0 GOOS=linux GOARCH="$arch" GOFLAGS=-mod=readonly \
              go build -trimpath -ldflags "-s -w -X main.version=${GITHUB_REF_NAME}" \
              -o "dropr-${GITHUB_REF_NAME}-linux-${arch}" ./cmd/dropr
          done
          sha256sum "dropr-${GITHUB_REF_NAME}-linux-"* > "dropr-${GITHUB_REF_NAME}-SHA256SUMS"
          cat "dropr-${GITHUB_REF_NAME}-SHA256SUMS"

      - name: Sign the binary checksums (keyless)
        run: |
          cosign sign-blob --yes --bundle "dropr-${GITHUB_REF_NAME}-SHA256SUMS.sigstore.json" \
            "dropr-${GITHUB_REF_NAME}-SHA256SUMS"

      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          printf 'Verify: see SECURITY.md.\n' > notes.md
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" \
            --notes-file notes.md \
            "dropr-assets-${GITHUB_REF_NAME}.sha256" \
            "dropr-${GITHUB_REF_NAME}-linux-amd64" "dropr-${GITHUB_REF_NAME}-linux-arm64" \
            "dropr-${GITHUB_REF_NAME}-SHA256SUMS" "dropr-${GITHUB_REF_NAME}-SHA256SUMS.sigstore.json"
