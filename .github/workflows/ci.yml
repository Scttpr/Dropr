# Build, lint and test.
#
#   pull_request   only the jobs whose inputs changed (see `changes`);
#                  e2e in every browser when browser code (web/, e2e/) or CI
#                  changed, else Chromium only
#   push to main   every job, e2e in every browser, fuzz smoke; saves caches
#
# Branch protection requires `ci-ok` (and security.yml's `security-ok`):
# it fails when any job failed and accepts jobs the path filter skipped.
# release.yml requires both to be green on the tagged commit.
#
# Run the same checks locally: make check, make lint-ci, make e2e.
# Actions are pinned by commit SHA (version in the trailing comment); Dependabot
# keeps them current.
name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions: {}

# One run per PR (a new push cancels the old run); every main commit gets its
# own run, since releases need a green ci-ok on the exact tagged commit.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read # paths-filter lists the PR's files through the API
    # Pushes and manual runs test everything; so does any change to CI or Nix.
    outputs:
      workflows: ${{ github.event_name != 'pull_request' || steps.filter.outputs.all == 'true' || steps.filter.outputs.workflows == 'true' }}
      go: ${{ github.event_name != 'pull_request' || steps.filter.outputs.all == 'true' || steps.filter.outputs.go == 'true' }}
      build: ${{ github.event_name != 'pull_request' || steps.filter.outputs.all == 'true' || steps.filter.outputs.go == 'true' || steps.filter.outputs.web == 'true' }}
      e2e: ${{ github.event_name != 'pull_request' || steps.filter.outputs.all == 'true' || steps.filter.outputs.go == 'true' || steps.filter.outputs.web == 'true' || steps.filter.outputs.e2e == 'true' }}
      all-browsers: ${{ github.event_name != 'pull_request' || steps.filter.outputs.all == 'true' || steps.filter.outputs.web == 'true' || steps.filter.outputs.e2e == 'true' }}
    steps:
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with: { egress-policy: audit }
      - if: github.event_name == 'pull_request'
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            all:
              - .github/workflows/ci.yml
              - .github/actions/**
              - scripts/ci/**
              - flake.nix
              - flake.lock
              - nix/**
              - Makefile
            workflows:
              - .github/**
              - scripts/**
            go:
              - go.mod
              - go.sum
              - cmd/**
              - internal/**
              - dev/**
              - .golangci.yml
            web:
              - web/**
            e2e:
              - e2e/**

  lint-workflows:
    name: Lint workflows and scripts (actionlint, zizmor, shellcheck)
    needs: changes
    if: needs.changes.outputs.workflows == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with: { egress-policy: audit }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: ./.github/actions/setup-nix
        with: { cache-key: ci-shell }
      - env:
          GH_TOKEN: ${{ github.token }} # zizmor's online audits (impostor commits, known-vulnerable actions)
        run: nix develop .#ci -c make lint-ci

  go-lint:
    name: Go lint (golangci-lint)
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with: { egress-policy: audit }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: ./.github/actions/setup-nix
        with: { cache-key: ci-shell }
      - uses: ./.github/actions/go-cache
        with: { cache-key: lint }
      - run: nix develop .#ci -c make lint

  go-test:
    name: Go tests (race detector, coverage)
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with: { egress-policy: audit }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: ./.github/actions/setup-nix
        with: { cache-key: ci-shell }
      - uses: ./.github/actions/go-cache
        with: { cache-key: test }
      - run: nix develop .#ci -c make cover
      - name: Coverage summary
        run: |
          {
            echo '### Go coverage'
            echo '```'
            nix develop .#ci -c go tool cover -func=coverage.out | tail -1
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  nix-build:
    name: Nix build (binary, web assets and web tests, flake eval)
    needs: changes
    if: needs.changes.outputs.build == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with: { egress-policy: audit }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: ./.github/actions/setup-nix
        with: { cache-key: nix-build }
      - name: Evaluate every output on every system
        run: nix flake check --no-build --all-systems
      # checks.go-test is left out: go-test runs the same tests with -race.
      - name: Build the binary and web assets, run the web tests
        run: |
          nix build -L --no-link \
            .#checks.x86_64-linux.dropr .#checks.x86_64-linux.web-assets .#checks.x86_64-linux.web
      - if: failure()
        run: echo "::error::If the failure is a hash mismatch, run 'make hashes' and commit nix/hashes.nix."
      - name: Reproducibility (web assets build twice, identical)
        if: github.event_name == 'push'
        run: nix build --no-link --rebuild .#web-assets

  integration:
    name: Go integration tests (Keycloak)
    needs: changes
    if: needs.changes.outputs.go == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with: { egress-policy: audit }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: ./.github/actions/keycloak
      - uses: ./.github/actions/setup-nix
        with: { cache-key: ci-shell }
      - uses: ./.github/actions/go-cache
        with: { cache-key: test }
      - run: nix develop .#ci -c make test-keycloak

  e2e:
    name: E2E (${{ matrix.browser }})
    needs: changes
    if: needs.changes.outputs.e2e == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        browser: ${{ fromJSON(needs.changes.outputs.all-browsers == 'true' && '["chromium", "firefox", "webkit"]' || '["chromium"]') }}
    steps:
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with: { egress-policy: audit }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: ./.github/actions/keycloak
      - uses: ./.github/actions/setup-nix
        with: { cache-key: e2e, store-size: 6G } # dev shell with browsers, plus mesa
      - uses: ./.github/actions/go-cache
        with: { cache-key: e2e }
      # Ubuntu 24.04 restricts unprivileged user namespaces through AppArmor;
      # WebKit's sandbox needs them.
      - if: matrix.browser == 'webkit'
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - env:
          BROWSER: ${{ matrix.browser }}
        run: nix develop -c scripts/ci/e2e.sh "$BROWSER"
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report-${{ matrix.browser }}
          path: e2e/playwright-report
          retention-days: 14
          if-no-files-found: ignore

  fuzz-smoke:
    name: Fuzz smoke (10 s per target)
    needs: changes
    if: github.event_name == 'push' && needs.changes.outputs.go == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with: { egress-policy: audit }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: ./.github/actions/setup-nix
        with: { cache-key: ci-shell }
      - uses: ./.github/actions/go-cache
        with: { cache-key: test }
      - run: nix develop .#ci -c make fuzz FUZZTIME=10s

  ci-ok:
    name: ci-ok
    needs: [changes, lint-workflows, go-lint, go-test, nix-build, integration, e2e, fuzz-smoke]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Every job passed or was skipped by the path filter
        env:
          RESULTS: ${{ join(needs.*.result, ' ') }}
        run: |
          echo "results: $RESULTS"
          case " $RESULTS " in
            *" failure "* | *" cancelled "*) exit 1 ;;
          esac
