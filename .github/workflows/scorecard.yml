# OpenSSF Scorecard: rates the repository's supply-chain practices (pinned
# actions, token permissions, branch protection, signed releases, ...) and
# publishes the score for the README badge. Kept alone in its own workflow,
# as scorecard-action requires for publish_results.
name: scorecard

on:
  push:
    branches: [main]
  schedule:
    - cron: "41 6 * * 1"
  branch_protection_rule:
  workflow_dispatch:

permissions: {}

jobs:
  scorecard:
    name: OpenSSF Scorecard
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write # upload results
      id-token: write        # publish results to the Scorecard API
    steps:
      - uses: step-security/harden-runner@dc2769abcc0fcfbadfc1df54081c1608579ef6b2 # v2.22.2
        with: { egress-policy: audit }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: scorecard.sarif
          results_format: sarif
          publish_results: true
      - uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: scorecard.sarif
          category: scorecard
