# Release on a signed v* tag. Three jobs, each with only the permissions it
# needs:
#
#   verify   the tag is SSH-signed by a maintainer key, points into main, and
#            that commit's ci-ok and security-ok passed (no second test run)
#   build    reproducible binaries + SBOMs + web asset hashes; cosign keyless
#            signatures and GitHub build-provenance / SBOM attestations
#   image    those binaries packaged as a multi-arch image on ghcr.io, pushed
#            by digest, cosign-signed and attested
#   publish  the GitHub release
#
# How users verify a release: SECURITY.md.
name: release

on:
  push:
    tags: ["v*"]

permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify the tag (signature, on main, CI green)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      checks: read # ci-ok / security-ok results of the tagged commit
    steps:
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with: { egress-policy: audit }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false, fetch-depth: 0 }
      # Fails closed: no release from a tag that is unsigned, signed by a key
      # not listed below, or not pointing at the commit being built (audit
      # 2026-11b L-6). The maintainers' public keys are listed here and in
      # SECURITY.md. Add a line per maintainer key.
      - name: Verify the tag signature
        run: |
          # checkout may leave the tag lightweight; fetch the annotated object.
          git fetch --force origin "refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"
          test "$(git cat-file -t "$GITHUB_REF_NAME")" = tag
          test "$(git rev-parse "${GITHUB_REF_NAME}^{commit}")" = "$GITHUB_SHA"
          cat > "$RUNNER_TEMP/allowed_signers" <<'KEYS'
          git.reformer354@passmail.net namespaces="git" ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIDZjQZiLBUTB+CxltkP0SER456htd7hruQMHmsWlGTMA
          KEYS
          git -c gpg.ssh.allowedSignersFile="$RUNNER_TEMP/allowed_signers" tag -v "$GITHUB_REF_NAME"
      - name: The tagged commit is on main and its CI passed
        env:
          GH_TOKEN: ${{ github.token }}
        run: scripts/ci/require-green-main.sh "$GITHUB_SHA"

  build:
    name: Build, sign and attest
    needs: verify
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write     # keyless cosign signatures and attestations
      attestations: write # store the attestations
    steps:
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with: { egress-policy: audit }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      # No store cache: this job holds id-token and must not substitute store
      # paths that pull-request jobs (which run npm ci outside the sandbox)
      # could have influenced (audit 2026-11b L-6). Everything comes from
      # cache.nixos.org or is built here.
      - uses: ./.github/actions/setup-nix
        with: { cache-key: release, cache: "false" }
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      - name: Build (reproducibility checked)
        run: nix develop .#ci -c scripts/ci/release-build.sh "$GITHUB_REF_NAME"

      # Both hash lists are signed: SECURITY.md's "check a running instance"
      # procedure trusts the asset hashes (audit 2026-11b L-6).
      - name: Sign the binary checksums and the asset hashes (cosign keyless)
        run: |
          for f in "dist/dropr-${GITHUB_REF_NAME}-SHA256SUMS" "dist/dropr-assets-${GITHUB_REF_NAME}.sha256"; do
            cosign sign-blob --yes --bundle "$f.sigstore.json" "$f"
          done

      - name: Attest build provenance (SLSA)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/dropr-*-linux-amd64
            dist/dropr-*-linux-arm64
            dist/dropr-assets-*.sha256
      - name: Attest the SBOM (amd64)
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/dropr-${{ github.ref_name }}-linux-amd64
          sbom-path: dist/dropr-${{ github.ref_name }}-linux-amd64.cdx.json
      - name: Attest the SBOM (arm64)
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/dropr-${{ github.ref_name }}-linux-arm64
          sbom-path: dist/dropr-${{ github.ref_name }}-linux-arm64.cdx.json

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: dist/
          retention-days: 7
          if-no-files-found: error

  image:
    name: Publish the container image
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write     # push to ghcr.io
      id-token: write     # keyless cosign signature and attestation
      attestations: write # store the attestation
    outputs:
      ref: ${{ steps.push.outputs.ref }}
    steps:
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with: { egress-policy: audit }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with: { persist-credentials: false }
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3

      # Podman ships with the runner. The Dockerfile only copies files, so
      # the arm64 image needs no emulation. Docker format keeps HEALTHCHECK.
      - name: Build the image (amd64, arm64)
        run: |
          podman build --format docker --platform linux/amd64,linux/arm64 \
            --build-arg VERSION="$GITHUB_REF_NAME" --manifest dropr .

      - name: Push by digest
        id: push
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin <<<"$GH_TOKEN"
          podman manifest push --all --format v2s2 --digestfile digest dropr \
            "docker://$image:$GITHUB_REF_NAME"
          {
            echo "name=$image"
            echo "digest=$(cat digest)"
            echo "ref=$image:$GITHUB_REF_NAME@$(cat digest)"
          } >> "$GITHUB_OUTPUT"

      - name: Smoke test the pushed image
        env:
          REF: ${{ steps.push.outputs.ref }}
        run: podman run --rm "$REF" version | grep -F "dropr $GITHUB_REF_NAME "

      - name: Sign the image (cosign keyless)
        env:
          REF: ${{ steps.push.outputs.ref }}
        run: cosign sign --yes "$REF"

      - name: Attest build provenance (SLSA)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ steps.push.outputs.name }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

  publish:
    name: Publish the GitHub release
    needs: [build, image]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write # create the release
    steps:
      - uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with: { egress-policy: audit }
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - env:
          GH_TOKEN: ${{ github.token }}
          IMAGE: ${{ needs.image.outputs.ref }}
        run: |
          gh release create "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --verify-tag \
            --title "$GITHUB_REF_NAME" --generate-notes \
            --notes "Image: \`$IMAGE\`

          Verify the binaries, image, SBOMs and asset hashes: see SECURITY.md." \
            dist/*
